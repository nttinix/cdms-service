[project]
name = "cdms-prototype"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdms*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
